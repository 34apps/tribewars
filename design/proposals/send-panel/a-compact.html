<!doctype html><html lang="en"><head><meta charset="utf-8"><title>A compact panel</title><link rel="stylesheet" href="common.css">
<style>
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.unit input.num{flex:1}
</style></head><body>
<aside class="panel"><div class="pscroll">
 <div class="head"><div><h2>Abandoned village</h2><small>ABANDONED</small></div><button class="btn small">Send res.</button><button class="x">✕</button></div>
 <div class="card"><div style="flex:1"><div class="k">Ruin 1 of 6</div><b style="font-size:1rem">Abandoned hamlet · 77 points</b></div></div>
 <div class="facts"><div><span>Location</span><b>−15|−15</b></div><div><span>Distance</span><b>4.0 fields</b></div><div><span>Terrain</span><b>Grassland</b></div><div><span>Strength</span><b class="weak">Weak</b></div></div>
 <div class="seg"><button class="on">Attack</button><button>Support</button><button>Scout</button></div>
 <div class="chips"><span class="chip">All troops</span><span class="chip">Decoy</span><span class="chip">Save as group</span><span class="chip">Clear</span></div>
 <div class="grid">
  <div class="unit"><img src="../../../apps/web/src/art/units/icon/pikeman.svg"><div class="n">Pikeman</div><button class="h">304 at home</button><div class="row"><input class="num" value="0"></div></div>
  <div class="unit"><img src="../../../apps/web/src/art/units/icon/guard.svg"><div class="n">Shieldbearer</div><button class="h">304 at home</button><div class="row"><input class="num" value="0"></div></div>
  <div class="unit has"><img src="../../../apps/web/src/art/units/icon/raider.svg"><div class="n">Raider</div><button class="h">304 at home</button><div class="row"><input class="num" value="120"></div></div>
  <div class="unit"><img src="../../../apps/web/src/art/units/icon/outrider.svg"><div class="n">Outrider</div><button class="h">304 at home</button><div class="row"><input class="num" value="0"></div></div>
  <div class="unit"><img src="../../../apps/web/src/art/units/icon/logram.svg"><div class="n">Log Ram</div><button class="h">304 at home</button><div class="row"><input class="num" value="0"></div></div>
  <div class="unit has"><img src="../../../apps/web/src/art/units/icon/boulder.svg"><div class="n">Boulder Sling</div><button class="h">304 at home</button><div class="row"><input class="num" value="40"></div></div>
 </div>
 <div class="sum"><div><span>Travel</span><b>2m 24s</b></div><div><span>Arrives</span><b>10:17:24 PM</b></div><div><span>Can carry</span><b>7,200</b></div></div>
</div>
<div class="sticky"><button class="btn sun">⚔ Send attack</button></div></aside>
</body></html>
